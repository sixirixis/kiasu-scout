[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiasu-scout"
version = "0.1.0"
description = "Singapore/SEA AI answer visibility MVP for children activities, toys, tuition, and enrichment businesses"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "KiasuScout"}]
dependencies = [
  "fastapi>=0.110.0",
  "mcp>=1.0.0",
  "pydantic>=2.0.0",
  "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0", "ruff>=0.8"]

[project.scripts]
kiasu-scout-mcp = "answerspot_sg_mcp.server:main"
kiasu-scout-web = "answerspot_sg_mcp.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
answerspot_sg_mcp = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.vercel]
entrypoint = "src.answerspot_sg_mcp.web:app"
